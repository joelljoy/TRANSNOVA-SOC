{% extends "base.html" %}
{% block title %}Contact | TransNova Logistics{% endblock %}
{% block content %}
<section class="wrap page narrow">
  <h1>Get a quote</h1>
  {% if sent %}
    <p class="ok">Thank you, {{ name }}. A sales coordinator will reply within one working day.</p>
  {% else %}
  <form method="post" action="/contact" class="stack">
    <label for="name">Name</label><input id="name" name="name" maxlength="100" required>
    <label for="email">Email</label><input id="email" name="email" type="email" maxlength="200">
    <label for="message">Cargo, route and dates</label><textarea id="message" name="message" maxlength="2000" rows="5" required></textarea>
    <button type="submit">Send request</button>
  </form>
  {% endif %}
</section>
{% endblock %}
