{% extends "base.html" %}
{% block title %}Track shipment - TransNova Logistics{% endblock %}
{% block content %}
<section class="panel narrow">
  <h2>Track a shipment</h2>
  <form method="get" action="/search">
    <label>Shipment or container number <input name="q" value="{{ q }}" maxlength="200"></label>
    <button class="btn" type="submit">Search</button>
  </form>
  {% if q %}<p>No results for &ldquo;{{ q }}&rdquo;.</p>{% endif %}
  {% if bait %}<p class="small muted">Older shipments are archived in the reporting replica (<a href="{{ bait }}">latest export</a>).</p>{% endif %}
</section>
{% endblock %}
