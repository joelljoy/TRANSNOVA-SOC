[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cowrie-soc"
version = "0.1.0"
description = "Cowrie SSH honeypot log collector, normalizer and detector for the PS04 SOC pipeline"
requires-python = ">=3.11"
# Runtime is standard library only (tomllib, sqlite3, urllib, http.server).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cowrie-soc = "cowrie_soc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
