# Cowrie operator overlay for the PS04 SSH decoy.
#
# Layered on top of Cowrie's bundled cowrie.cfg.dist (only overrides live here).
# Any key can also be overridden at runtime with COWRIE_<SECTION>_<OPTION>
# environment variables, e.g. COWRIE_HONEYPOT_SENSOR_NAME=cowrie-lab-2.
#
# Everything exposed by this honeypot is synthetic. Do not put real
# credentials, hostnames or data in this file or in decoy-fs/.

[honeypot]
sensor_name = ssh-01
hostname = bkp-db-01
# Session recordings hold every keystroke, including anything typed at a password prompt.
ttylog = false
etc_path = /etc/cowrie
timezone = UTC
# Daily rotation: cowrie.json -> cowrie.json.YYYY-MM-DD. The collector follows it.
logtype = rotating
idle_timeout = 180
authentication_timeout = 60
# Bind every outbound socket opened by emulated commands (wget, curl, tftp,
# ftpget, ...) to loopback. Connecting from 127.0.0.1 to any non-loopback
# destination fails, so the decoy cannot fetch attacker payloads or reach
# other hosts. Verified in docs/safety-and-isolation.md.
out_addr = 127.0.0.1
# Keep anything that does get stored (SFTP/SCP uploads) small.
download_limit_size = 1048576

[shell]
# Bundled Debian template plus our synthetic decoy files (built in Dockerfile).
filesystem = /etc/cowrie/fs.pickle

[ssh]
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
# No TCP forwarding: the decoy must never relay attacker traffic.
forwarding = false
forward_redirect = false
forward_tunnel = false
sftp_enabled = true
auth_keyboard_interactive_enabled = false

[telnet]
enabled = false

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
